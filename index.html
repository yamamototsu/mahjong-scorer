function calcBasePoints(fu, han, kiriage) {
  if (han >= 13) return 8000 * Math.max(1, Math.floor(han / 13));
  if (han >= 11) return 6000;
  if (han >= 8) return 4000;
  if (han >= 6) return 3000;
  if (han >= 5) return 2000;
  if (kiriage) {
    if (han === 4 && fu >= 30) return 2000;
    if (han === 3 && fu >= 60) return 2000;
  }
  return Math.min(fu * Math.pow(2, 2 + han), 2000);
}
function roundUp100(n) {
  return Math.ceil(n / 100) * 100;
}
function calcScore(fu, han, isParent, isTsumo, kiriage, pc) {
  const base = calcBasePoints(fu, han, kiriage);
  if (pc === 3) {
    if (isTsumo) {
      const e = roundUp100(base * (isParent ? 3 : 2));
      return {
        total: e * 2,
        each: e,
        fromParent: e,
        fromChild: e
      };
    }
    return {
      total: roundUp100(base * (isParent ? 6 : 4))
    };
  }
  if (isParent) {
    if (isTsumo) {
      const e = roundUp100(base * 2);
      return {
        total: e * 3,
        each: e
      };
    } else {
      return {
        total: roundUp100(base * 6)
      };
    }
  } else {
    if (isTsumo) {
      const c = roundUp100(base),
        p = roundUp100(base * 2);
      return {
        total: c * 2 + p,
        fromChild: c,
        fromParent: p
      };
    } else {
      return {
        total: roundUp100(base * 4)
      };
    }
  }
}
